name: phone-selftest

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  selftest:
    if: vars.SELFTEST_FROM != ''
    runs-on: ubuntu-latest
    steps:
      - name: Run the dry-run screen check on the test phone
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            bash /opt/soloone-phone-gateway/ci/selftest.sh "${{ vars.SELFTEST_FROM }}" "${{ vars.SELFTEST_TO }}" "${{ vars.SELFTEST_REACT_TEXT }}"
